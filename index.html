<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Twogether"/>
<title>Twogether</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;}
input,textarea{-webkit-appearance:none;border-radius:0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.2);padding:12px 14px;color:#fff;font-size:15px;outline:none;width:100%;transition:border-color 0.15s ease,background 0.15s ease;}
input:focus,textarea:focus{border-color:#fff;background:rgba(255,255,255,0.06);}
textarea{font-family:Georgia,serif;font-style:italic;font-size:14px;resize:none;line-height:1.7;overflow:hidden;}
button{cursor:pointer;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:0.2}50%{opacity:0.9}}
.spin{width:24px;height:24px;border:2px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}
nav{position:sticky;top:0;z-index:10;background:rgba(0,0,0,0.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.1);padding:env(safe-area-inset-top) 24px 0;display:flex;justify-content:space-between;align-items:center;height:52px;}
nav span{font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;}
.tabs{display:flex;gap:20px;}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:4px 0;color:rgba(255,255,255,0.4);font-size:10px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;}
.tab.active{color:#fff;border-bottom-color:#fff;}
.page{padding:48px 24px 80px;max-width:560px;margin:0 auto;}
h1{font-weight:700;font-size:clamp(40px,11vw,60px);line-height:0.92;letter-spacing:-0.02em;text-transform:uppercase;margin-bottom:20px;}
h2{font-weight:700;font-size:clamp(26px,7vw,40px);line-height:0.95;letter-spacing:-0.02em;text-transform:uppercase;margin-bottom:20px;}
.label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:8px;display:block;}
.divider{height:1px;background:rgba(255,255,255,0.1);margin:20px 0;}
.italic{font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,0.6);font-size:14px;line-height:1.75;}
.btn{display:block;width:100%;background:#fff;border:none;padding:14px;color:#000;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-top:32px;}
.btn:disabled{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.3);}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.5);display:block;width:100%;padding:13px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;margin-top:12px;}
.progress{height:2px;background:rgba(255,255,255,0.1);margin-bottom:32px;position:relative;}
.progress-fill{position:absolute;top:0;left:0;height:100%;background:#fff;transition:width 0.3s;}
.person-btn{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.1);padding:20px 0;display:flex;justify-content:space-between;align-items:center;text-align:left;}
.person-name{font-weight:700;font-size:clamp(24px,6vw,34px);color:#fff;text-transform:uppercase;letter-spacing:-0.01em;}
.badge{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;}
.badge.done{color:#E8FF6B;}
.badge.todo{color:rgba(255,255,255,0.38);}
.reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.reveal-section{border-bottom:1px solid rgba(255,255,255,0.08);padding:16px 0;}
.reveal-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.38);margin-bottom:10px;}
.reveal-text{font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,0.75);font-size:13px;line-height:1.65;}
.bullet-row{display:flex;gap:12px;margin-bottom:8px;}
.bullet-dash{color:rgba(255,255,255,0.35);font-size:11px;margin-top:2px;flex-shrink:0;}
.waiting-dots{display:flex;gap:6px;margin-top:20px;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.4);}
.err{color:rgba(255,80,60,0.9);font-family:Georgia,serif;font-style:italic;font-size:13px;margin-top:10px;display:none;}
.banner{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.97);border-top:2px solid #E8FF6B;padding:20px 24px calc(20px + env(safe-area-inset-bottom));z-index:100;}
.banner-title{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#E8FF6B;margin-bottom:6px;}
.email-btn{display:inline-block;background:#E8FF6B;color:#000;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:12px 24px;text-decoration:none;margin-top:10px;}
.center{display:flex;align-items:center;justify-content:center;height:80vh;flex-direction:column;gap:16px;}
.pname{display:none;font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-bottom:8px;}
@media(max-width:599px){
  input[type=text],textarea{font-size:16px!important;}
  .reveal-grid{grid-template-columns:1fr;gap:0;}
  .ans-col{border-right:none!important;padding-right:0!important;}
  .ans-col + .ans-col{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.08);}
  .names-header{display:none;}
  .pname{display:block;}
}
</style>
</head>

<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// CONFIG
var SURL = 'https://kpzeahhwldycfgaxlvsx.supabase.co';
var SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwemVhaGh3bGR5Y2ZnYXhsdnN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MzQ0MDAsImV4cCI6MjA5MjMxMDQwMH0.czEq-f5EhaiP2mD-XHdz2BZ08sqkeCv_HO8cbKu77ZM';
var EMAIL = 'Ninanaclay0306@gmail.com';
// Dev-only guest sign-in: visible only when the URL has ?dev (never for real users).
var DEV = /[?&]dev(=|&|$)/.test(location.search);
// Which sign-in methods are live on the screen. Flip a flag to true the moment
// that provider is configured in Supabase (Google is coming right after launch).
var PROVIDERS = { apple:true, google:true, email:true };
// Dev-only offline mock: ?mock skips auth entirely and uses a local in-browser store.
var MOCK = /[?&]mock(=|&|$)/.test(location.search);
var mockStore = { weeks:{} };
function mockLoad(){ try{ mockStore = JSON.parse(localStorage.getItem('tw_mockdb')||'{"weeks":{}}'); }catch(e){ mockStore={weeks:{}}; } }
function mockSave(){ try{ localStorage.setItem('tw_mockdb', JSON.stringify(mockStore)); }catch(e){} }
var PHOTO_MAX = 1;

// SUPABASE (auth + RLS-enforced data)
function isNative(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }
// On native we complete OAuth manually via the app deep-link, so detectSessionInUrl is off there.
var sb = window.supabase.createClient(SURL, SKEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl: !isNative(), flowType:'pkce' } });
function authRedirect(){ return isNative() ? 'space.twogether.app://auth-callback' : (window.location.origin + window.location.pathname); }
function capPlugin(name){ return (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins[name] : null; }
// Native OAuth: open the provider in the in-app browser; the deep-link handler finishes sign-in.
async function oauthNative(provider){
  var r = await sb.auth.signInWithOAuth({ provider:provider, options:{ redirectTo: authRedirect(), skipBrowserRedirect:true } });
  var B = capPlugin('Browser');
  if (r && r.data && r.data.url && B) B.open({ url: r.data.url });
}
function signInGoogle(){ if (isNative()) return oauthNative('google'); sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: authRedirect() } }); }
function signInApple(){ if (isNative()) return oauthNative('apple'); sb.auth.signInWithOAuth({ provider:'apple', options:{ redirectTo: authRedirect() } }); }
function signInEmail(email){ return sb.auth.signInWithOtp({ email:email, options:{ emailRedirectTo: authRedirect() } }); }
function signInGuest(){ sb.auth.signInAnonymously().then(function(r){ if(r&&r.error){ var e=document.getElementById('authErr'); if(e){e.textContent='Guest sign-in is off. Enable Anonymous sign-ins in Supabase.';e.style.display='block';} } }); }
async function signOut(){ try{ await sb.auth.signOut(); }catch(e){} ST.user=null;ST.couple=null;ST.cid=null;ST.myIndex=null;ST.names=null;ST.li=null;ST.wd=null;ST.weeks=[];ST.justMatched=false;stopPoll();stopPairPoll();set({screen:'auth'}); }

// who is the signed-in user paired with?
async function loadCouple(){
  var mine = await sb.from('couple_members').select('couple_id,partner_index,display_name').eq('user_id', ST.user.id).limit(1);
  if (mine.error || !mine.data || !mine.data.length) return null;
  var cid = mine.data[0].couple_id;
  var mem = await sb.from('couple_members').select('partner_index,display_name').eq('couple_id', cid);
  var names=['',''];
  (mem.data||[]).forEach(function(m){ names[m.partner_index]=m.display_name||''; });
  names[0]=names[0]||'Partner 1'; names[1]=names[1]||'Partner 2';
  var cpl = await sb.from('couples').select('id,invite_code,locked').eq('id', cid).single();
  return { cid:cid, myIndex:mine.data[0].partner_index, names:names, couple:cpl.data };
}
async function createCouple(name){
  var r = await sb.rpc('create_couple', { p_name:name });
  if (r.error){ console.error('create_couple', r.error); return null; }
  return r.data;
}
async function joinCouple(code, name){
  var r = await sb.rpc('join_couple', { p_code:code, p_name:name });
  if (r.error){ var msg=(r.error.message||'').toLowerCase(); var key=['invalid_code','couple_locked','couple_full','already_in_couple'].find(function(k){return msg.indexOf(k)>=0;}); return { error: key||'join_failed' }; }
  return { couple:r.data };
}
// Legacy auto-import removed: matching old data by name alone risks linking a
// same-named couple's history. Identity is by account/email; legacy data (only
// one real couple) is migrated explicitly, tied to each partner's email.
async function claimLegacy(){ /* disabled by design */ }

// QUESTIONS
var QS = [
  {id:'appreciation',label:'Appreciation',num:'01',q:'What are 3 things your partner did this week that you loved?',type:'bullets',req:true,retired:true},
  {id:'loved',label:'Feeling Loved',num:'02',q:'What are 3 things your partner did that made you feel loved or cared for?',type:'bullets',req:true},
  {id:'attraction',label:'Admiration',num:'03',q:'What are 3 moments you felt attracted to, proud of, or admired your partner?',type:'bullets',req:true,hint:'Playful, emotional, physical — all welcome.'},
  {id:'deep',label:'Deep Appreciation',num:'04',q:'What is one thing you deeply appreciate about your partner right now?',type:'para',req:true,max:300},
  {id:'improve',label:'Growth',num:'05',q:'What is one thing you would like your partner to improve?',type:'para',req:true,hint:'Be kind and specific. Focus on behavior.'},
  {id:'future',label:'Next Week',num:'06',q:'What is one thing you want to prioritize together next week?',type:'para',req:true},
  {id:'open',label:'Anything Else',num:'07',q:'Anything else you want to say?',type:'para',req:false,hint:'Optional.'},
];
// Questions still asked in the check-in form. Retired questions stay in QS (so the
// Archive/Reveal/export can still render past answers) but are excluded from the form.
var FORM_QS = QS.filter(function(q){ return !q.retired; });
FORM_QS.push({ id:'photos', label:'Photo', q:'Add a photo from this week', type:'photos', req:false });
function emptyA() { return {appreciation:['','',''],loved:['','',''],attraction:['','',''],deep:'',improve:'',future:'',open:'',photos:[]}; }

// WEEK
function getWeek() {
  var d = new Date();
  var utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  utc.setUTCDate(utc.getUTCDate() + 4 - (utc.getUTCDay() || 7));
  var y = utc.getUTCFullYear();
  var w = Math.ceil((((utc - new Date(Date.UTC(y,0,1)))/86400000)+1)/7);
  return y + '-W' + String(w).padStart(2,'0');
}
function wkLabel(wk) {
  var parts = wk.split('-W');
  var y = parseInt(parts[0]);
  var w = parseInt(parts[1]);
  var jan4 = new Date(Date.UTC(y,0,4));
  var start = new Date(jan4);
  start.setUTCDate(jan4.getUTCDate() - (jan4.getUTCDay()||7) + 1 + (w-1)*7);
  var end = new Date(start);
  end.setUTCDate(start.getUTCDate()+6);
  var f = function(d) { return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
  return f(start) + ' – ' + f(end);
}

// STORAGE
function lsGet(k) { try { var v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch(e){return null;} }
function lsSet(k,v) { try { localStorage.setItem(k,JSON.stringify(v)); } catch(e){} }
// In-progress check-in draft — one per couple+partner, persists across weeks until submitted.
function draftKey() { return 'tw_draft_'+ST.cid+'_'+ST.myIndex; }
function saveDraft(a) {
  if (ST.cid==null || ST.myIndex==null) return;
  lsSet(draftKey(), a||ST.ans);
  lsSet(draftTsKey(), Date.now());
  cloudSaveDraft(a||ST.ans);
}
function draftHasContent(d) {
  if (!d) return false;
  for (var k in d) { var v=d[k];
    if (Array.isArray(v)) { if (v.some(function(x){return x && String(x).trim();})) return true; }
    else if (v && String(v).trim()) return true;
  }
  return false;
}
function loadDraft() {
  if (ST.cid==null || ST.myIndex==null) return null;
  var d = lsGet(draftKey());
  if (d && draftHasContent(d)) return d;
  // recover a stranded draft saved on this device under an older week/couple key
  var suf = '_'+ST.myIndex;
  for (var i=0;i<localStorage.length;i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf('tw_draft_')===0 && k.slice(-suf.length)===suf && k!==draftKey()) {
      var od = lsGet(k);
      if (od && draftHasContent(od)) { lsSet(draftKey(), od); return od; }
    }
  }
  return d || null;
}
function clearDraft() {
  try {
    var suf = '_'+ST.myIndex, rm = [];
    for (var i=0;i<localStorage.length;i++) { var k = localStorage.key(i); if (k && (k.indexOf('tw_draft_')===0 || k.indexOf('tw_draftts_')===0) && k.slice(-suf.length)===suf) rm.push(k); }
    rm.forEach(function(k){ localStorage.removeItem(k); });
  } catch(e){}
  cloudClearDraft();
}
function hasDraftContent() { return draftHasContent(loadDraft()); }
// Which form step to resume on: the first question left unfilled (i.e. where they
// dropped off). A brand-new check-in → 0; a fully-filled draft → the last step.
function qFilled(a, q) {
  var v = a ? a[q.id] : null;
  if (q.type==='bullets') return Array.isArray(v) && v.some(function(x){ return x && String(x).trim(); });
  if (q.type==='photos')  return Array.isArray(v) && v.length>0;
  return !!(v && String(v).trim());
}
function resumeStep(a) {
  for (var i=0;i<FORM_QS.length;i++) { if (!qFilled(a, FORM_QS[i])) return i; }
  return FORM_QS.length-1;
}
// ── Cloud draft sync (best-effort backup of the localStorage draft) ──────────
// localStorage stays the instant, primary store; the cloud copy just lets a draft
// follow the user to another device. All cloud calls are non-blocking / fire-and-
// forget so they never slow down or break the check-in if offline.
function draftTsKey() { return 'tw_draftts_'+ST.cid+'_'+ST.myIndex; }
function localDraftTs() { var v=lsGet(draftTsKey()); return typeof v==='number'?v:0; }
var _cloudDraftTimer = null;
function cloudSaveDraft(a) {
  if (MOCK || !ST.user || ST.cid==null) return;
  if (_cloudDraftTimer) clearTimeout(_cloudDraftTimer);
  var snap = JSON.parse(JSON.stringify(a||ST.ans)), cid=ST.cid, uid=ST.user.id;
  _cloudDraftTimer = setTimeout(function(){
    sb.from('checkin_drafts')
      .upsert({ couple_id:cid, user_id:uid, answers:snap, updated_at:new Date().toISOString() }, { onConflict:'couple_id,user_id' })
      .then(function(r){ if (r && r.error) console.warn('cloud draft save', r.error); });
  }, 800);
}
async function cloudLoadDraft() {
  if (MOCK || !ST.user || ST.cid==null) return null;
  try {
    var r = await sb.from('checkin_drafts').select('answers,updated_at')
      .eq('couple_id',ST.cid).eq('user_id',ST.user.id).limit(1);
    if (r.error || !r.data || !r.data.length) return null;
    return { answers:r.data[0].answers, ts:Date.parse(r.data[0].updated_at)||0 };
  } catch(e) { return null; }
}
function cloudClearDraft() {
  if (MOCK || !ST.user || ST.cid==null) return;
  var cid=ST.cid, uid=ST.user.id;
  sb.from('checkin_drafts').delete().eq('couple_id',cid).eq('user_id',uid)
    .then(function(){}, function(){});
}
function mkCid(a,b) { return [a,b].map(function(n){return n.toLowerCase().trim();}).sort().join('_').replace(/\s+/g,''); }

// STATE
var ST = {
  screen: 'loading',
  tab: 0,
  user: null,
  couple: null,
  cid: null,
  myIndex: null,
  names: null,
  li: null,
  wd: null,
  weeks: [],
  step: 0,
  ans: emptyA(),
  expDone: false,
  mailto: null,
  poll: null,
  statusPoll: null,
  weekStatus: null,
  photoCache: {},
  pairPoll: null,
  justMatched: false,
  archExp: {},
  archCache: {}
};

function set(patch) {
  for (var k in patch) ST[k] = patch[k];
  draw();
}

// DATA
async function loadWk(cid, wk) {
  if (MOCK) { var w=(mockStore.weeks||{})[wk]||{}; var md={}; if(w.a0){md.a0=w.a0;md.t0=w.t0;} if(w.a1){md.a1=w.a1;md.t1=w.t1;} await resolvePhotos(md); return (md.a0||md.a1)?md:null; }
  var r = await sb.from('checkins').select('partner_index,answers,submitted_at').eq('couple_id',cid).eq('iso_week',wk);
  if (r.error || !r.data || !r.data.length) return null;
  var d = {};
  r.data.forEach(function(row) { d['a'+row.partner_index]=row.answers; d['t'+row.partner_index]=row.submitted_at; });
  await resolvePhotos(d);
  return d;
}
// --- photos (private Supabase Storage bucket "checkin-photos") ---
async function resolvePhotos(d) {
  if (MOCK) return;
  var paths = [];
  [d && d.a0, d && d.a1].forEach(function(a){
    if (a && Array.isArray(a.photos)) a.photos.forEach(function(p){ if (p && !ST.photoCache[p]) paths.push(p); });
  });
  if (!paths.length) return;
  try {
    var r = await sb.storage.from('checkin-photos').createSignedUrls(paths, 3600);
    if (r && r.data) r.data.forEach(function(x){ if (x.signedUrl) ST.photoCache[x.path] = x.signedUrl; });
  } catch(e) { console.error('signedUrls', e); }
}
async function uploadPhoto(file) {
  if (MOCK) { var mu=URL.createObjectURL(file); ST.photoCache[mu]=mu; return mu; }
  try {
    var ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')) || 'jpg';
    var path = ST.cid + '/' + getWeek() + '/' + ST.myIndex + '/' + Date.now() + '-' + Math.floor(Math.random()*1e6) + '.' + ext;
    var r = await sb.storage.from('checkin-photos').upload(path, file, { upsert:false, contentType: file.type || 'image/jpeg' });
    if (r.error) { console.error('upload', r.error); ST.lastUploadError = r.error.message || String(r.error); return null; }
    return path;
  } catch(e) { console.error('upload ex', e); ST.lastUploadError = (e && e.message) || String(e); return null; }
}
async function onPhotos(input) {
  ST.ans.photos = ST.ans.photos || [];
  ST.photoErr = null;
  var files = Array.prototype.slice.call(input.files || []).slice(0, PHOTO_MAX - ST.ans.photos.length);
  for (var i=0;i<files.length;i++) {
    var f = files[i], preview = URL.createObjectURL(f);
    ST.photoPending = preview; draw();          // show the image right away
    var path = await uploadPhoto(f);
    ST.photoPending = null;
    if (path) { ST.ans.photos.push(path); ST.photoCache[path] = preview; saveDraft(ST.ans); }
    else { ST.photoErr = 'Upload failed: ' + (ST.lastUploadError || 'unknown error'); }
    draw();
  }
}
function removePhoto(i) { if (ST.ans.photos) { ST.ans.photos.splice(i,1); saveDraft(ST.ans); draw(); } }
async function loadWeeks(cid) {
  if (MOCK) return Object.keys(mockStore.weeks||{}).sort().reverse();
  var r = await sb.from('checkins').select('iso_week').eq('couple_id',cid).order('iso_week',{ascending:false});
  if (r.error || !r.data) return [];
  var seen={},out=[]; r.data.forEach(function(row){ if(!seen[row.iso_week]){seen[row.iso_week]=1;out.push(row.iso_week);} });
  return out;
}
async function saveWk(cid, wk, pi, ans) {
  if (MOCK) { mockStore.weeks=mockStore.weeks||{}; mockStore.weeks[wk]=mockStore.weeks[wk]||{}; mockStore.weeks[wk]['a'+pi]=ans; mockStore.weeks[wk]['t'+pi]=new Date().toISOString(); mockSave(); return [{}]; }
  var r = await sb.from('checkins').upsert({couple_id:cid, iso_week:wk, partner_index:pi, user_id:ST.user.id, answers:ans, submitted_at:new Date().toISOString()}, {onConflict:'couple_id,iso_week,partner_index'}).select();
  if (r.error){ console.error('saveWk', r.error); return null; }
  return r.data;
}

function startPoll() {
  if (ST.poll) clearInterval(ST.poll);
  ST.poll = setInterval(async function() {
    if (!ST.cid) return;
    var wd = await loadWk(ST.cid, getWeek());
    if (wd && wd.a0 && wd.a1) {

}

// Who has checked in this week (booleans only — no answers, which stay private till both submit)
async function loadStatus() {
  if (MOCK) { var mw=(mockStore.weeks||{})[getWeek()]||{}; ST.weekStatus={0:!!mw.a0,1:!!mw.a1}; return; }
  var st = {0:false, 1:false};
  try {
    var r = await sb.rpc('week_status', { wk: getWeek() });
    if (r && r.data) r.data.forEach(function(row){ st[row.partner_index] = row.submitted; });
  } catch(e) { /* RPC not present yet — fall back to own status below */ }
  var mine = ST.myIndex===0 ? (ST.wd&&ST.wd.a0) : (ST.wd&&ST.wd.a1);
  if (mine) st[ST.myIndex] = true;
  ST.weekStatus = st;
}
function refreshLobby() { loadStatus().then(function(){ if(ST.tab===0 && ST.screen!=='form') draw(); startStatusPoll(); }); }
function startStatusPoll() {
  stopStatusPoll();
  ST.statusPoll = setInterval(async function() {
    if (!ST.cid || ST.tab!==0 || ST.screen==='form') { stopStatusPoll(); return; }
    var before = JSON.stringify(ST.weekStatus);
    await loadStatus();
    var st = ST.weekStatus || {};
    var mySub = ST.myIndex===0 ? st[0] : st[1];
    if (st[0] && st[1] && mySub) {   // both done and I've submitted → open reveal
      stopStatusPoll();
      var wd = await loadWk(ST.cid, getWeek());
      set({wd:wd, tab:1, screen:'main'});
      return;
    }
    if (JSON.stringify(ST.weekStatus) !== before) draw();
  }, 5000);
}
function stopStatusPoll() { if (ST.statusPoll) { clearInterval(ST.statusPoll); ST.statusPoll = null; } }

// Watch for the partner joining; the moment the couple locks, celebrate the match.
function startPairPoll() {
  stopPairPoll();
  ST.pairPoll = setInterval(async function() {
    if (!ST.cid || (ST.couple && ST.couple.locked)) { stopPairPoll(); return; }
    var cpl = await sb.from('couples').select('id,invite_code,locked').eq('id', ST.cid).single();
    if (cpl.data && cpl.data.locked) {
      stopPairPoll();
      var mem = await sb.from('couple_members').select('partner_index,display_name').eq('couple_id', ST.cid);
      var names=['','']; (mem.data||[]).forEach(function(m){ names[m.partner_index]=m.display_name||''; });
      names[0]=names[0]||'Partner 1'; names[1]=names[1]||'Partner 2';
      ST.couple = cpl.data; ST.names = names;
      set({screen:'matched'});
    }
  }, 4000);
}

// BOOT
async function boot() {
  try {
    if (MOCK) {
      mockLoad();
      ST.user={id:'dev'}; ST.cid='dev-couple'; ST.couple={id:'dev-couple',invite_code:'DEV123',locked:true};
      ST.myIndex=0; ST.li=0; ST.names=['You','Partner'];
      var mwk=getWeek();
      var mwd=await loadWk('dev-couple', mwk);
      var mweeks=await loadWeeks('dev-couple');
      await loadStatus();
      var md=loadDraft(); ST.ans = md ? Object.assign(emptyA(), md) : emptyA();
      set({screen:'main', wd:mwd, weeks:mweeks, tab:0});
      startStatusPoll();
      return;
    }
    var sess = await sb.auth.getSession();
    var session = sess.data ? sess.data.session : null;
    if (!session) { set({screen:'auth'}); return; }
    ST.user = session.user;
    var c = await loadCouple();
    if (!c) { set({screen:'pair'}); return; }
    ST.cid=c.cid; ST.couple=c.couple; ST.myIndex=c.myIndex; ST.li=c.myIndex; ST.names=c.names;
    var wk = getWeek();
    var wd = await loadWk(c.cid, wk);
    var weeks = await loadWeeks(c.cid);
    await loadStatus();
    var mySubmitted = (c.myIndex===0 ? (wd&&wd.a0) : (wd&&wd.a1));
    var _draft = mySubmitted ? null : loadDraft();
    if (!mySubmitted) {
      // Cross-device sync: pull the cloud draft; newest copy (local vs cloud) wins.
      var _cloud = await cloudLoadDraft();
      if (_cloud && draftHasContent(_cloud.answers) && _cloud.ts > localDraftTs()) {
        _draft = _cloud.answers;
        lsSet(draftKey(), _draft); lsSet(draftTsKey(), _cloud.ts);   // hydrate this device
      } else if (_draft && draftHasContent(_draft)) {
        cloudSaveDraft(_draft);                                       // local is newer → back it up
      }
    }
    ST.ans = _draft ? Object.assign(emptyA(), _draft) : emptyA();
    if (ST.justMatched && c.couple && c.couple.locked) {
      ST.justMatched = false;
      set({screen:'matched', wd:wd, weeks:weeks, tab:0});
      return;
    }
    set({screen:'main', wd:wd, weeks:weeks, tab:0});
    if (c.couple && !c.couple.locked) startPairPoll(); else startStatusPoll();
  } catch(e) {
    console.error('boot', e);
    set({screen:'auth'});
  }
}

  });
}

      var val = a[pi] && a[pi][sec.id];
      if (Array.isArray(val)) {
        return val.filter(function(v){return v&&v.trim();}).map(function(v){return '<div class="bullet-row"><span class="bullet-dash">—</span><span class="reveal-text">'+esc(v)+'</span></div>';}).join('');
      }
      return '<p class="reveal-text" style="margin:0;color:'+(val&&val.trim()?'rgba(255,255,255,0.75)':'rgba(255,255,255,0.2)')+';">'+esc((val&&val.trim())||'—')+'</p>';
    });
    return '<div class="reveal-section"><div class="reveal-label">'+num+' — '+sec.label+'</div><div class="reveal-grid"><div class="ans-col" style="padding-right:12px;border-right:1px solid rgba(255,255,255,0.08);"><div class="pname">'+esc(s.names[0])+'</div>'+cols[0]+'</div><div class="ans-col"><div class="pname">'+esc(s.names[1])+'</div>'+cols[1]+'</div></div></div>';
  }).join('');
  var photoSec = '';
  if ((a[0]&&a[0].photos&&a[0].photos.length) || (a[1]&&a[1].photos&&a[1].photos.length)) {
    photoSec = '<div class="reveal-section"><div class="reveal-label">Photos</div><div class="reveal-grid">'+[0,1].map(function(pi){
      var ph=(a[pi]&&a[pi].photos)||[];
      return '<div class="ans-col"'+(pi===0?' style="padding-right:12px;border-right:1px solid rgba(255,255,255,0.08);"':'')+'><div class="pname">'+esc(s.names[pi])+'</div>'+(ph.length?ph.map(function(p){return '<img src="'+(ST.photoCache[p]||'')+'" style="width:100%;border-radius:2px;margin-bottom:8px;display:block;">';}).join(''):'<p class="reveal-text" style="color:rgba(255,255,255,0.2);margin:0;">—</p>')+'</div>';
    }).join('')+'</div></div>';
  }
  return '<div class="page"><span class="label">'+wkLabel(getWeek())+'</span><h2>This<br>Week\'s<br>Reveal</h2>'+
    '<div class="divider"></div>'+
    '<div class="reveal-grid names-header" style="padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.1);">'+
    s.names.map(function(n){return '<span style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;">'+esc(n)+'</span>';}).join('')+
    '</div>'+rows+photoSec+'</div>';
}

function drawRevealLocked() {
  var s=ST, s0=!!(s.wd&&s.wd.a0), s1=!!(s.wd&&s.wd.a1);
  var msg = s0&&!s1 ? 'Waiting for '+esc(s.names[1])+' to submit.' : s1&&!s0 ? 'Waiting for '+esc(s.names[0])+' to submit.' : 'Both partners need to submit first.';
  return '<div class="page"><span class="label">Reveal</span><h2 style="color:rgba(255,255,255,0.2);">Not yet.</h2><p class="italic">'+msg+'</p></div>';
}

function drawArchive() {
  var s=ST;
  if (!s.weeks.length) return '<div class="page"><p class="italic">Your archive will appear here after your first completed check-in.</p></div>';
  var rows = s.weeks.map(function(wk,i) {
    var open = !!s.archExp[wk], data = s.archCache[wk];
    var inner = '';
    if (open) {
      if (!data) { inner = '<div style="padding:16px;text-align:center;"><div class="spin" style="margin:0 auto;width:16px;height:16px;"></div></div>'; }
      else if (data.a0&&data.a1) {
        var a=[data.a0,data.a1];
        var empty = function(v){return !v||(Array.isArray(v)?v.every(function(x){return !x||!x.trim();}):!v.trim());};
        var shown = QS.filter(function(sec){ return !(empty(a[0]&&a[0][sec.id])&&empty(a[1]&&a[1][sec.id])); });
        inner = '<div style="padding-bottom:8px;">'+
          [0,1].map(function(pi){
            var body = shown.map(function(sec,idx){
              var num=String(idx+1).padStart(2,'0');
              var val=a[pi]&&a[pi][sec.id];
              var content;
              if(Array.isArray(val)){
                var items=val.filter(function(v){return v&&v.trim();});
                content = items.length ? items.map(function(v){return '<div class="bullet-row"><span class="bullet-dash">—</span><span style="font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,0.65);font-size:13px;line-height:1.65;">'+esc(v)+'</span></div>';}).join('') : '<p style="font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,0.2);font-size:13px;line-height:1.65;margin:0;">—</p>';
              } else {
                content = '<p style="font-family:Georgia,serif;font-style:italic;color:'+(val&&val.trim()?'rgba(255,255,255,0.65)':'rgba(255,255,255,0.2)')+';font-size:13px;line-height:1.65;margin:0;">'+esc((val&&val.trim())||'—')+'</p>';
              }
              return '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.06);"><div class="reveal-label" style="margin-bottom:8px;">'+num+' — '+sec.label+'</div>'+content+'</div>';
            }).join('');
            var aph=(a[pi]&&a[pi].photos)||[];
            var photoHtml = aph.length ? '<div style="display:flex;gap:2.5%;flex-wrap:wrap;margin-bottom:10px;">'+aph.map(function(p){return '<img src="'+(ST.photoCache[p]||'')+'" style="width:31.6%;border-radius:2px;display:block;">';}).join('')+'</div>' : '';
            return '<div style="margin-bottom:28px;"><div style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#fff;margin-bottom:16px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,0.18);">'+esc(s.names[pi])+'</div>'+photoHtml+body+'</div>';
          }).join('')+'</div>';
      } else { inner = '<p class="italic" style="padding:12px 0 20px;">Incomplete — awaiting both partners.</p>'; }
    }
    return '<div style="border-bottom:1px solid rgba(255,255,255,0.1);"><button onclick="togArch(\''+wk+'\')" style="width:100%;background:transparent;border:none;padding:18px 0;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;">'+
      '<div><div style="font-weight:700;font-size:clamp(15px,4vw,20px);color:#fff;text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:3px;">'+wkLabel(wk)+'</div>'+
      '<div style="display:flex;gap:10px;"><span style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.35);">#'+String(s.weeks.length-i).padStart(2,'0')+'</span>'+
      (wk===getWeek()?'<span style="font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:#E8FF6B;">Current</span>':'')+
      (s.archCache[wk]&&s.archCache[wk].a0&&s.archCache[wk].a1?'<span style="font-size:10px;text-transform:uppercase;color:rgba(255,255,255,0.25);">Complete</span>':'')+
      '</div></div>'+
      '<span style="color:rgba(255,255,255,0.35);font-size:20px;transform:'+(open?'rotate(45deg)':'none')+';transition:transform 0.2s;display:block;">+</span></button>'+
      (open?'<div>'+inner+'</div>':'')+
      '</div>';
  }).join('');
  return '<div class="page"><span class="label">Archive</span><h2>'+s.weeks.length+' Week'+(s.weeks.length!==1?'s':'')+' Together</h2><div class="divider"></div>'+rows+'</div>';
}

function drawBanner() {
  return '<div class="banner"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="banner-title">✓ Check-in complete</div><button onclick="set({expDone:false})" style="background:none;border:none;color:rgba(255,255,255,0.38);font-size:22px;cursor:pointer;">×</button></div>'+
    (ST.mailto?'<a href="'+ST.mailto+'" class="email-btn">Email Summary →</a>':'')+
    '</div>';
}

// BIND
function bindInputs() {
  document.querySelectorAll('input[type=text],textarea').forEach(function(el) {
    var sec = FORM_QS[ST.step];
    if (el.dataset.p && sec && sec.max) {
      el.addEventListener('input', function() {
        var cc = document.getElementById('cc');
        if (cc) cc.textContent = el.value.length + '/' + sec.max;
        if (el.value.length > sec.max) el.value = el.value.slice(0, sec.max);
      });
    }
  });
  document.querySelectorAll('textarea').forEach(function(t) {
    var fit = function(){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; };
    fit();
    t.addEventListener('input', fit);
  });
  // autosave the in-progress check-in as the user types
  document.querySelectorAll('[data-p],[data-b]').forEach(function(el) {
    el.addEventListener('input', function(){ saveDraft(collectA()); });
  });
}

// ACTIONS
function setTab(i) { stopPoll(); stopStatusPoll(); ST.screen='main'; set({tab:i}); if(i===0) refreshLobby(); }
function doSignOut() { signOut(); }
function doEmail() {
  var el=document.getElementById('authEmail'), err=document.getElementById('authErr'), msg=document.getElementById('authMsg');
  var email=el?el.value.trim():''; if(err)err.style.display='none';
  if(!email||email.indexOf('@')<1){ if(err){err.textContent='Enter a valid email address.';err.style.display='block';} return; }
  signInEmail(email).then(function(r){
    if(r && r.error){ if(err){err.textContent='Could not send the link. Try again.';err.style.display='block';} return; }
    if(msg){ msg.textContent='Check your email for a sign-in link.'; msg.style.display='block'; }
  });
}
async function doCreate() {
  var name=(document.getElementById('pairName').value||'').trim(), err=document.getElementById('pairErr');
  if(err)err.style.display='none';
  if(!name){ if(err){err.textContent='Enter your name first.';err.style.display='block';} return; }
  var c=await createCouple(name);
  if(!c){ if(err){err.textContent='Could not create your space. Try again.';err.style.display='block';} return; }
  ST.couple=c; ST.myIndex=0; ST.li=0; ST.names=[name,'Partner 2']; set({screen:'invite'});
}
async function doJoin() {
  var name=(document.getElementById('pairName').value||'').trim();
  var code=(document.getElementById('joinCode').value||'').trim();
  var err=document.getElementById('pairErr'); if(err)err.style.display='none';
  if(!name){ if(err){err.textContent='Enter your name first.';err.style.display='block';} return; }
  if(!code){ if(err){err.textContent="Enter your partner's code.";err.style.display='block';} return; }
  var r=await joinCouple(code, name);
  if(r.error){ var m={invalid_code:"That code doesn't match any space.",couple_locked:'That space is already full.',couple_full:'That space is already full.',already_in_couple:"You're already paired."}; if(err){err.textContent=(m[r.error]||'Could not join. Check the code and try again.');err.style.display='block';} return; }
  ST.justMatched = true;
  boot();
}
function copyCode(c) { try{ if(navigator.clipboard) navigator.clipboard.writeText(c); }catch(e){} }
function goMain() { boot(); }
function fBack() { var a=collectA(); saveDraft(a); set({screen:'main', tab:0}); refreshLobby(); }
function fPrev() { var a=collectA(); saveDraft(a); set({ans:a, step:ST.step-1}); }
function collectA() {
  var a = JSON.parse(JSON.stringify(ST.ans));
  var sec = FORM_QS[ST.step];
  if (sec.type==='bullets') {
    document.querySelectorAll('[data-b]').forEach(function(el){
      var parts=el.dataset.b.split(':'), id=parts[0], i=parseInt(parts[1]);
      a[id][i]=el.value;
    });
  } else {
    var el=document.querySelector('[data-p]');
    if(el) a[el.dataset.p]=el.value;
  }
  return a;
}
async function fNext() {
  var a=collectA(), sec=FORM_QS[ST.step];
  saveDraft(a);
  if (sec.req) {
    var v=a[sec.id];
    var empty = Array.isArray(v) ? !v.every(function(x){return x.trim();}) : !v.trim();
    if (empty) {
      var fe=document.getElementById('ferr'); if(fe)fe.style.display='block';
      set({ans:a}); return;
    }
  }
  if (ST.step < FORM_QS.length-1) { set({ans:a, step:ST.step+1}); return; }
  var nb=document.getElementById('nb');
  if(nb){nb.textContent='Saving…';nb.disabled=true;}
  var cid=ST.cid, wk=getWeek(), li=ST.li;
  var res = await saveWk(cid, wk, li, a);
  if (res===null) {
    if(nb){nb.textContent='Submit';nb.disabled=false;}
    alert('Save failed. Please check your connection and try again.'); return;
  }
  clearDraft();
  var wd=await loadWk(cid,wk);
  var weeks=ST.weeks.indexOf(wk)>=0?ST.weeks:[wk].concat(ST.weeks);
  await loadStatus();
  var st=ST.weekStatus||{};
  if(st[0] && st[1]){
    if(wd&&wd.a0&&wd.a1) doExport(ST.names,[wd.a0,wd.a1],wk);
    set({wd:wd,weeks:weeks,screen:'main',tab:1,li:li});
  } else {
    set({wd:wd,weeks:weeks,screen:'main',tab:0,li:li});
    startStatusPoll();
  }
}
async function togArch(wk) {
  ST.archExp[wk] = !ST.archExp[wk];
  if (ST.archExp[wk] && !ST.archCache[wk]) {
    draw();
    var wd = await loadWk(ST.cid, wk);
    ST.archCache[wk] = wd || {};
  }
  draw();
}
function buildTxt(names,ans,wk) {
  var t='TWOGETHER — WEEKLY CHECK-IN\n'+wkLabel(wk)+'\n'+'─'.repeat(40)+'\n\n';
  var n=0;
  QS.forEach(function(sec){
    var empty=function(v){return !v||(Array.isArray(v)?v.every(function(x){return !x||!x.trim();}):!v.trim());};
    if(empty(ans[0]&&ans[0][sec.id])&&empty(ans[1]&&ans[1][sec.id]))return;
    n++;
    t+=String(n).padStart(2,'0')+' — '+sec.label.toUpperCase()+'\n\n';
    [0,1].forEach(function(pi){
      t+=names[pi].toUpperCase()+'\n';
      var v=ans[pi]&&ans[pi][sec.id];
      if(Array.isArray(v))v.filter(function(x){return x&&x.trim();}).forEach(function(x){t+='  · '+x+'\n';});
      else t+='  '+(v&&v.trim()||'—')+'\n';
      t+='\n';
    });
    t+='─'.repeat(40)+'\n\n';
  });
  return t+'Archived '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}
function doExport(names,ans,wk) {
  if(lsGet('tw_exp_'+wk))return;
  var txt=buildTxt(names,ans,wk);
  var sub=encodeURIComponent('Twogether — '+wkLabel(wk));
  var body=encodeURIComponent(txt);
  lsSet('tw_exp_'+wk,{at:new Date().toISOString()});
  set({expDone:true, mailto:'mailto:'+EMAIL+'?subject='+sub+'&body='+body});
}
</script>
</body>
